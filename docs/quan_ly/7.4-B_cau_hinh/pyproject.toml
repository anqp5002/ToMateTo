# Cấu hình backend ToMateTo (DOC 7.4-B): Python 3.11, ruff, mypy, pytest.
[project]
name = "tomateto-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle lỗi
  "W",   # pycodestyle cảnh báo
  "F",   # pyflakes
  "I",   # sắp xếp import
  "N",   # đặt tên theo PEP 8
  "UP",  # cú pháp Python mới
  "B",   # lỗi dễ gặp (bugbear)
  "S",   # an toàn (bandit)
  "C4",  # comprehension
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # test dùng assert

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
