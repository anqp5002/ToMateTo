[build-system]
requires = ["setuptools>=68", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "tomateto-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "SQLAlchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4", "fastapi>=0.115,<1",
    "strawberry-graphql[fastapi]>=0.280,<1", "Pillow>=11,<14", "uvicorn>=0.30,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tomateto*"]

[tool.setuptools.package-data]
"tomateto.dataaccess.content" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["../db/tests", "tests"]
pythonpath = ["src", ".."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "S", "C4"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/tests", "$MYPY_CONFIG_FILE_DIR/../db"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/.."]
exclude = ["db/migrations/versions"]
explicit_package_bases = true
