name: CI

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tomateto
          POSTGRES_PASSWORD: change_me_dev_only
          POSTGRES_DB: tomateto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tomateto -d tomateto_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL_TEST: postgresql+psycopg://tomateto:change_me_dev_only@localhost:5432/tomateto_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest -q

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Flutter project
        id: project
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: subosito/flutter-action@v2
        if: steps.project.outputs.present == 'true'
        with:
          channel: stable
      - run: flutter pub get
        if: steps.project.outputs.present == 'true'
        working-directory: app
      - run: dart format --set-exit-if-changed .
        if: steps.project.outputs.present == 'true'
        working-directory: app
      - run: flutter analyze
        if: steps.project.outputs.present == 'true'
        working-directory: app
      - run: flutter test
        if: steps.project.outputs.present == 'true'
        working-directory: app
